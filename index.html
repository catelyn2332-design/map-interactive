<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map Interactive</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, #10141f 0%, #1a2233 55%, #22304a 100%);
      color: #e8edf7;
    }
    .card {
      max-width: 560px;
      padding: 48px 40px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(122, 162, 247, 0.35);
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #7aa2f7;
      border: 1px solid rgba(122, 162, 247, 0.45);
      border-radius: 999px;
      padding: 5px 14px;
      margin-bottom: 22px;
    }
    h1 { font-size: 34px; margin-bottom: 14px; }
    p.desc { font-size: 16px; line-height: 1.65; color: #aab6cf; margin-bottom: 28px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }
    a.btn:hover { opacity: 0.85; }
    a.primary { background: #7aa2f7; color: #10141f; }
    a.ghost { border: 1px solid rgba(232, 237, 247, 0.35); color: #e8edf7; }
    footer { margin-top: 30px; font-size: 12px; color: #6b7a99; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Projet</span>
    <h1>Map Interactive</h1>
    <p class="desc">
      Application cartographique interactive : explorez, annotez et naviguez
      sur des cartes avec une expérience fluide et moderne.
    </p>
    <div class="actions">
      <a class="btn primary" href="https://github.com/catelyn2332-design/map-interactive">Voir le code source</a>
      <a class="btn ghost" href="https://github.com/catelyn2332-design">Mon profil GitHub</a>
    </div>
    <footer>Créé avec OnSpace · Hébergé sur GitHub Pages</footer>
  </main>
</body>
</html>
